# Dev override: mount source, run with host UID/GID, use live-reload (Air + next dev).
# Use with: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up
# Ensure HOST_UID and HOST_GID are set (e.g. by Makefile run target).
# Postgres uses a named volume so data (e.g. plugin config) persists across make stop / make run.
#
# Every service is capped on CPU, memory and PIDs. A runaway process in the dev
# stack -- a rebuild loop, a request storm, a leak -- would otherwise take the
# whole machine down with it, and under WSL2 that means the host becomes
# unresponsive rather than just the container. The caps total well under the
# host so the editor and shell keep running, and memswap_limit is pinned equal
# to mem_limit so a leaking container is OOM-killed (a visible, diagnosable
# event) instead of dragging everything into swap thrash.

services:
  postgres:
    volumes:
      - postgres_data:/var/lib/postgresql/data
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256

  portfoliodb:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile.dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - ../.env
    environment:
      HOME: /tmp/air-home
      GOCACHE: /app/.cache/go-build
      GOMODCACHE: /app/.gomodcache
      BUF_CACHE_DIR: /app/.cache/buf
      # Single level (info, warn, error, debug) or JSON e.g. {"server/plugins": "debug", "default": "info"}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      - ..:/app
    command: [ "air" ]
    # Headroom for a parallel go build on each Air rebuild.
    cpus: 4
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 512

  envoy:
    volumes:
      - ./envoy.dev.yaml:/etc/envoy/envoy.yaml:ro
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256

  redis:
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256

  client:
    build:
      context: ..
      dockerfile: docker/client/Dockerfile.dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - ../.env
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      # Poll for file changes so bind-mounted source updates are picked up (inotify often doesn't propagate into the container).
      CHOKIDAR_USEPOLLING: "true"
      # Give npm a writable HOME when HOST_UID has no /etc/passwd entry (e.g. CI runner uid 1001).
      HOME: /tmp
    volumes:
      - ..:/app
    working_dir: /app/client
    # Bootstrap node_modules on first start (or after package-lock.json changes), then exec the command.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /app/client/node_modules/.package-lock.json ] || [ /app/client/package-lock.json -nt /app/client/node_modules/.package-lock.json ]; then
          (cd /app/client && npm ci)
        fi
        exec "$$@"
      - --
    command: [ "sh", "/app/client/scripts/dev-with-codegen.sh" ]
    # Headroom for npm ci and a Next dev compile.
    cpus: 4
    mem_limit: 4g
    memswap_limit: 4g
    pids_limit: 512

volumes:
  postgres_data:
