services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    # Same pinned work_mem as the main stack, for the same reason and doubly so
    # here: this is where the benchmarks run, so a figure from BENCH_VALUATION is
    # only comparable to the last one if the memory budget behind it was the same.
    # See the comment in docker-compose.yml.
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "work_mem=16MB"]
    environment:
      POSTGRES_USER: portfoliodb
      POSTGRES_PASSWORD: portfoliodb
      POSTGRES_DB: portfoliodb_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfoliodb"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Go test runner for db-test. Reuses the server dev image (go + cached module deps)
  # and connects to the postgres service over the compose network.
  tester:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile.dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOCACHE: /app/.cache/go-build
      GOMODCACHE: /app/.gomodcache
      TEST_DATABASE_URL: postgres://portfoliodb:portfoliodb@postgres:5432/portfoliodb_test?sslmode=disable
      # Opt-in performance tests. Passed through from the host with no default so
      # that `BENCH_BALANCE=1 make db-test` reaches the container, and an unset one
      # leaves the test skipped.
      BENCH_BALANCE: "${BENCH_BALANCE:-}"
      BENCH_VALUATION: "${BENCH_VALUATION:-}"
    volumes:
      - ..:/app
    working_dir: /app
    entrypoint: []
    command: ["true"]
