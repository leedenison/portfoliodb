// EODPriceProto is a single end-of-day price row for admin browsing.
message EODPriceProto {
  string instrument_id = 1;
  string instrument_display_name = 2;
  // Valid time: the trading date this bar describes.
  string price_date = 3;               // "YYYY-MM-DD"
  // OHLC are decimal strings in the instrument's own currency.
  optional string open = 4 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string high = 5 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string low = 6 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  string close = 7 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  // The provider's own adjusted close, on the provider's basis and typically
  // including dividend adjustment. Never an input to valuation; see
  // docs/spec/bitemporality.md. Decimal string.
  optional string adjusted_close = 8 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional int64 volume = 9;
  string data_provider = 10;
  // Knowledge time: when this row was last fetched. Staleness only -- it says
  // nothing about the prices themselves.
  google.protobuf.Timestamp last_fetched_at = 11;
  // The share count the raw values are denominated in, as "YYYY-MM-DD".
  string share_count_basis = 13;
}

message ListPricesRequest {
  string search = 1;                     // instrument name/ticker substring
  // Half-open [date_from, date_before); unset bounds are open-ended.
  google.type.Date date_from = 2;        // inclusive
  google.type.Date date_before = 3;      // exclusive
  string data_provider = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListPricesResponse {
  repeated EODPriceProto prices = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// ExportPrices streams the price part of an admin archive: one group per
// instrument, carrying the best identifier for it.
message ExportPricesRequest {}

// ExportCoverage is one half-open [from, before) corporate event coverage span
// for an instrument, streamed alongside the events it covers. It records that a
// provider answered for the range, which the events cannot say on their own: a
// span with no events in it means the provider was asked and had nothing.
// Re-importing events without their coverage loses that.
//
// Prices state the same thing as archive.v1.PriceGroup.coverage; this goes the
// same way when corporate events move to the archive schema.
message ExportCoverage {
  string identifier_type = 1;
  string identifier_value = 2;
  string identifier_domain = 3;
  string from = 4;   // YYYY-MM-DD, inclusive
  string before = 5; // YYYY-MM-DD, exclusive
}

// ExportPricesResponse is one element of the export stream: the envelope first,
// exactly once, then one message per instrument group.
//
// The envelope travels on the stream rather than being built by the caller
// because exported_at is knowledge time and has to be the server's clock, and
// source_instance is a server property the browser does not know.
message ExportPricesResponse {
  oneof item {
    portfoliodb.archive.v1.Envelope envelope = 1;
    portfoliodb.archive.v1.PriceGroup group = 2;
  }
}

// ImportPricesRequest carries one archive's price part. The envelope is the
// file's own, forwarded rather than rebuilt, so the server sees the
// format_version and the kind the file declared rather than what the uploading
// client assumed.
message ImportPricesRequest {
  portfoliodb.archive.v1.Envelope envelope = 1 [(buf.validate.field).required = true];
  portfoliodb.archive.v1.PricePart prices = 2 [(buf.validate.field).required = true];
}

message ImportPricesResponse {
  string job_id = 1;
}

// GetPortfolioValuation computes one value per day over the half-open
// [date_from, date_before) range, so the last point is the day before
// date_before.
// display_currency converts holdings to the given currency (ISO 4217, e.g. "USD").
// When empty, the user's stored preference is used.
message GetPortfolioValuationRequest {
  string portfolio_id = 1;
  google.type.Date date_from = 2 [(buf.validate.field).required = true];   // inclusive
  google.type.Date date_before = 3 [(buf.validate.field).required = true]; // exclusive
  string display_currency = 4;
}

// ValuationPoint is one day's portfolio value.
// total_value sums only priced instruments; unpriced_instruments lists display
// names for instruments missing prices on that date.
message ValuationPoint {
  string date = 1;
  double total_value = 2;
  repeated string unpriced_instruments = 3;
}

message GetPortfolioValuationResponse {
  repeated ValuationPoint points = 1;
}

// DeclarationKind distinguishes the declaration that seeds an opening balance from
// the ones that are checked against it. It is derived from the declaration dates for
// a holding, not chosen: the earliest is the pad and the rest are assertions.
enum DeclarationKind {
  DECLARATION_KIND_UNSPECIFIED = 0;
  // The earliest declaration for a holding. It generates the INITIALIZE transaction
  // that makes the declared quantity true, so it is true by construction.
  DECLARATION_KIND_PAD = 1;
  // A later declaration. It generates nothing and is checked against the computed
  // holding at its as_of_date.
  DECLARATION_KIND_ASSERT = 2;
}

// HoldingDeclaration is a user-provided statement of known holding quantity at a date.
message HoldingDeclaration {
  string id = 1;
  string broker = 2;
  string account = 3;
  string instrument_id = 4;
  Instrument instrument = 5;  // optional; populated when listing
  string declared_qty = 6;           // numeric string to preserve precision
  google.type.Date as_of_date = 7;
  // The date at which the share count declared_qty is denominated in was current.
  // as_of_date means the quantity was read off a record of that date; today means it
  // was read off a current holdings view. Always populated on read.
  // See docs/spec/bitemporality.md.
  google.type.Date share_count_basis = 8;
  // Read-only; derived from the declaration dates for this holding.
  DeclarationKind kind = 9;
  // What the transactions add up to at as_of_date, in share_count_basis, including
  // the holding's pad. Numeric string. Read-only, and recomputed on every read, so
  // it follows an ingestion, an instrument merge or a split recompute with nothing
  // to invalidate. See docs/spec/fixed-point.md#verification.
  string computed_qty = 10;
  // computed_qty - declared_qty. Numeric string; positive means the transactions
  // account for more than was declared. Read-only.
  string delta = 11;
  // How far delta may stray from zero before it means something. Numeric string,
  // derived from the rounding scale of the split conversion and the number of share
  // count bases that contribute one; zero when no split falls in the window, which
  // is the common case. Read-only.
  string tolerance = 12;
  // Whether the declaration reconciles: abs(delta) <= tolerance. Always true for a
  // pad, which is made true by construction. Read-only.
  bool matched = 13;
  // How many postings the computed quantity was summed from. Read-only.
  int32 posting_count = 14;
}

message ListHoldingDeclarationsRequest {}

message ListHoldingDeclarationsResponse {
  repeated HoldingDeclaration declarations = 1;
}

