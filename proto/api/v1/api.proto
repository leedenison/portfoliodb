// DeclarationKind distinguishes the declaration that seeds an opening balance from
// the ones that are checked against it. It is derived from the declaration dates for
// a holding, not chosen: the earliest is the pad and the rest are assertions.
enum DeclarationKind {
  DECLARATION_KIND_UNSPECIFIED = 0;
  // The earliest declaration for a holding. It generates the INITIALIZE transaction
  // that makes the declared quantity true, so it is true by construction.
  DECLARATION_KIND_PAD = 1;
  // A later declaration. It generates nothing and is checked against the computed
  // holding at its as_of_date.
  DECLARATION_KIND_ASSERT = 2;
}

// HoldingDeclaration is a user-provided statement of known holding quantity at a date.
message HoldingDeclaration {
  string id = 1;
  string broker = 2;
  string account = 3;
  string instrument_id = 4;
  Instrument instrument = 5;  // optional; populated when listing
  string declared_qty = 6;           // numeric string to preserve precision
  google.type.Date as_of_date = 7;
  // The date at which the share count declared_qty is denominated in was current.
  // as_of_date means the quantity was read off a record of that date; today means it
  // was read off a current holdings view. Always populated on read.
  // See docs/spec/bitemporality.md.
  google.type.Date share_count_basis = 8;
  // Read-only; derived from the declaration dates for this holding.
  DeclarationKind kind = 9;
  // What the transactions add up to at as_of_date, in share_count_basis, including
  // the holding's pad. Numeric string. Read-only, and recomputed on every read, so
  // it follows an ingestion, an instrument merge or a split recompute with nothing
  // to invalidate. See docs/spec/fixed-point.md#verification.
  string computed_qty = 10;
  // computed_qty - declared_qty. Numeric string; positive means the transactions
  // account for more than was declared. Read-only.
  string delta = 11;
  // How far delta may stray from zero before it means something. Numeric string,
  // derived from the rounding scale of the split conversion and the number of share
  // count bases that contribute one; zero when no split falls in the window, which
  // is the common case. Read-only.
  string tolerance = 12;
  // Whether the declaration reconciles: abs(delta) <= tolerance. Always true for a
  // pad, which is made true by construction. Read-only.
  bool matched = 13;
  // How many postings the computed quantity was summed from. Read-only.
  int32 posting_count = 14;
}

