// EODPriceProto is a single end-of-day price row for admin browsing.
message EODPriceProto {
  string instrument_id = 1;
  string instrument_display_name = 2;
  // Valid time: the trading date this bar describes.
  string price_date = 3;               // "YYYY-MM-DD"
  // OHLC are decimal strings in the instrument's own currency.
  optional string open = 4 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string high = 5 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string low = 6 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  string close = 7 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  // The provider's own adjusted close, on the provider's basis and typically
  // including dividend adjustment. Never an input to valuation; see
  // docs/spec/bitemporality.md. Decimal string.
  optional string adjusted_close = 8 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional int64 volume = 9;
  string data_provider = 10;
  // Knowledge time: when this row was last fetched. Staleness only -- it says
  // nothing about the prices themselves.
  google.protobuf.Timestamp last_fetched_at = 11;
  // The share count the raw values are denominated in, as "YYYY-MM-DD".
  string share_count_basis = 13;
}

message ListPricesRequest {
  string search = 1;                     // instrument name/ticker substring
  // Half-open [date_from, date_before); unset bounds are open-ended.
  google.type.Date date_from = 2;        // inclusive
  google.type.Date date_before = 3;      // exclusive
  string data_provider = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListPricesResponse {
  repeated EODPriceProto prices = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// ExportPrices streams all cached EOD prices. Each row carries the best identifier for the instrument.
message ExportPricesRequest {}

// ExportCoverage is one half-open [from, before) coverage span for an
// instrument, streamed alongside the rows it covers. It records that a provider
// answered for the range, which the rows cannot say on their own: a span with no
// rows in it means the provider was asked and had nothing. Re-importing rows
// without their coverage loses that.
message ExportCoverage {
  string identifier_type = 1;
  string identifier_value = 2;
  string identifier_domain = 3;
  string from = 4;   // YYYY-MM-DD, inclusive
  string before = 5; // YYYY-MM-DD, exclusive
}

// ExportPricesResponse is one element of the export stream. Coverage spans are
// sent before the rows they cover.
message ExportPricesResponse {
  oneof item {
    ExportPriceRow row = 1;
    ExportCoverage coverage = 2;
  }
}

// ExportPriceRow is one price row with instrument identifier context.
message ExportPriceRow {
  string identifier_type = 1;    // IdentifierType name (e.g. "ISIN", "MIC_TICKER", "OPENFIGI_TICKER")
  string identifier_value = 2;
  string identifier_domain = 3;  // MIC for MIC_TICKER, exchange code for OPENFIGI_TICKER, source for BROKER_DESCRIPTION, empty otherwise
  string price_date = 4;         // "YYYY-MM-DD"
  // OHLC are decimal strings in the instrument's own currency. Export and import
  // are a round-trip pair: a row that does not reimport identically is a bug, and
  // a double on either side loses digits a NUMERIC column holds.
  optional string open = 5 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string high = 6 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string low = 7 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  string close = 8 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string adjusted_close = 9 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional int64 volume = 10;
  AssetClass asset_class = 11;   // denormalized from instrument
  google.protobuf.Timestamp exported_at = 12; // when the export was generated
  string currency = 13;          // ISO 4217 currency code; denormalized from instrument
}

// ImportPriceRow is one price row to import. When the instrument is unknown, asset_class
// is used as the security type hint for identifier plugin routing. When UNSPECIFIED, plugins
// are skipped and the instrument is created with just the supplied identifier.
message ImportPriceRow {
  string identifier_type = 1;
  string identifier_value = 2;
  string identifier_domain = 3;
  string price_date = 4;
  // OHLC are decimal strings in the instrument's own currency. ImportPrices is
  // unary, so these patterns are enforced at the validating interceptor.
  optional string open = 5 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string high = 6 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string low = 7 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  string close = 8 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string adjusted_close = 9 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional int64 volume = 10;
  AssetClass asset_class = 11;   // optional; security type hint for plugin routing on unknown instruments
  string currency = 12;          // optional; ISO 4217 currency code used as hint for validation
  // The share count these raw values are denominated in, as "YYYY-MM-DD".
  // Optional; defaults to price_date, meaning the row is as-traded. Set it only
  // when the file holds a back-adjusted series, in which case it is the date the
  // provider adjusted to. See docs/spec/bitemporality.md.
  string share_count_basis = 13;
}

message ImportPricesRequest {
  repeated ImportPriceRow prices = 1;
  // Optional coverage ranges. When set for an instrument, the server records
  // the range as covered, so valuation carries prices forward across
  // non-trading days within it. When absent, each row covers only its own date
  // and gaps between rows stay gaps.
  repeated ImportCoverage coverage = 2;
  // Knowledge time: when the supplied data was current. OCC symbols are
  // split-adjusted to this point during instrument resolution, and imported
  // rows record it as last_fetched_at. It does not determine which share count
  // the prices are denominated in -- that is ImportPriceRow.share_count_basis.
  google.protobuf.Timestamp exported_at = 3;
}

// ImportCoverage declares that the caller has authoritative coverage of a
// half-open [from, before) date range for an instrument. The server stores it,
// so the range is not re-fetched and prices carry forward across non-trading
// days inside it.
message ImportCoverage {
  string identifier_type = 1;
  string identifier_value = 2;
  string identifier_domain = 3;
  string from = 4;   // YYYY-MM-DD, inclusive
  string before = 5; // YYYY-MM-DD, exclusive
}

message ImportPricesResponse {
  string job_id = 1;
}

message ImportPriceError {
  int32 index = 1;    // index into request.prices
  string message = 2;
}

// GetPortfolioValuation computes one value per day over the half-open
