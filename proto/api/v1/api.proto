syntax = "proto3";

package portfoliodb.api.v1;

import "archive/v1/archive.proto";
import "archive/v1/common.proto";
import "archive/v1/corporate_events.proto";
import "archive/v1/declarations.proto";
import "archive/v1/fetch_blocks.proto";
import "archive/v1/inflation.proto";
import "archive/v1/instruments.proto";
import "archive/v1/plugin_config.proto";
import "archive/v1/preferences.proto";
import "archive/v1/prices.proto";
import "archive/v1/txs.proto";
import "archive/v1/unhandled_events.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "type/v1/type.proto";

option go_package = "github.com/leedenison/portfoliodb/proto/api/v1;apiv1";

// InstrumentIdentifier is one (type, domain, value) for an instrument.
// For BROKER_DESCRIPTION, domain is the source (e.g. "Fidelity:web:fidelity-csv") and value is the instrument_description.
// For MIC_TICKER, domain is an ISO 10383 MIC code (or empty when unknown). For OPENFIGI_TICKER, domain is a Bloomberg/OpenFIGI exchange code (e.g. "US").
// canonical = false only for broker-description identifiers.
message InstrumentIdentifier {
  portfoliodb.type.v1.IdentifierType type = 1;
  string value = 2;
  bool canonical = 3;
  string domain = 4; // optional; MIC for MIC_TICKER, exchange code for OPENFIGI_TICKER, source for BROKER_DESCRIPTION
  // The half-open [valid_from, valid_before) interval in market time the name
  // was correct for the instrument. An absent valid_before means it is the name
  // the instrument wears now; an absent valid_from means the name predates
  // everything known about it.
  // See docs/adr/0055-identifier-validity-is-an-interval.md.
  optional string valid_from = 5; // "YYYY-MM-DD"
  optional string valid_before = 6; // "YYYY-MM-DD"
}

// Instrument is canonical security-master data for an instrument, with its identifiers.
// When asset_class is OPTION or FUTURE, underlying_id must be set.
message Instrument {
  string id = 1;
  portfoliodb.type.v1.AssetClass asset_class = 2;
  string exchange = 3;
  string currency = 4;
  string name = 5;
  repeated InstrumentIdentifier identifiers = 6;
  string underlying_id = 7;   // UUID of underlying instrument when this is a derivative (OPTION/FUTURE).
  // The half-open [valid_from, valid_before) interval the instrument was
  // available to trade in. Both optional; an unset bound is open-ended.
  google.protobuf.Timestamp valid_from = 8;   // inclusive
  google.protobuf.Timestamp valid_before = 9; // exclusive: when it ceased to be available
  Instrument underlying = 10; // Populated in ListTxs/GetHoldings so clients need not fetch separately.
  Exchange exchange_info = 11; // Rich exchange data from exchanges table JOIN; populated when exchange_mic is set.
  string cik = 12;            // SEC Central Index Key (optional).
  string sic_code = 13;       // SIC industry classification code (optional).
  // Option fields (denormalized from OCC identifier).
  // strike is a component of option identity, decoded from the OCC symbol's
  // eight digits of thousandths, so it is an exact decimal string rather than a
  // double: comparing identity components as floats is a latent bug. Optional
  // rather than sentinel-zero, because a non-option has no strike and
  // an instrument import would otherwise have to send one.
  optional string strike = 14 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  string expiry = 15;             // YYYY-MM-DD expiry date; empty for non-options.
  string put_call = 16;           // "C" or "P"; empty for non-options.
  // Deliverable multiplier as a decimal string; unset means the column default
  // of 1. A non-standard split leaves a fraction here (3:2 gives 1.5), and it
  // multiplies a posting's weight, so it stays exact.
  optional string contract_multiplier = 17 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  // The currency lines this security trades in. Every security has at least one.
  repeated Listing listings = 18;
}

// Listing is one currency a security trades in. Currency and exchange are facts
// about a listing rather than about the security above it: a security listed in
// GBP and in USD may carry one ISIN, and holdings in the two lines are not
// fungible because they differ by an FX rate.
//
// A security holds one listing per currency family -- GBX and GBP are one family
// -- and at most one listing whose currency is unknown.
// See docs/adr/0068-a-listing-is-a-currency-of-a-security.md.
message Listing {
  string id = 1;
  // ISO 4217 code the line is quoted in, in the units it is quoted in: GBX for a
  // London line quoted in pence, not the GBP its family collapses to.
  //
  // Empty is the unknown listing, which says how many lines this security has is
  // unknown rather than that it has one. It is never priced and never
  // event-bearing, because a price with no stated currency asserts nothing.
  string currency = 2;
  // The half-open [valid_from, valid_before) interval the line was tradeable in.
  // An absent valid_before means the line is current; an absent valid_from means
  // it predates everything known about it.
  optional string valid_from = 3; // "YYYY-MM-DD"
  optional string valid_before = 4; // "YYYY-MM-DD"
}

// Exchange is ISO 10383 MIC reference data for an instrument's exchange.
message Exchange {
  string mic = 1;
  string name = 2;
  string acronym = 3;
  string country_code = 4;
}

// Tx represents one broker-reported transaction.
message Tx {
  // When the transaction was ordered, and the date this posting is filed under:
  // windows, listings and the day-bucketing grouping rules all use this one. See
  // archive.v1.Posting.order_date. Required.
  google.protobuf.Timestamp order_date = 1 [(buf.validate.field).required = true];
  // Account (opaque string). Required.
  string account = 2;
  // What kind of leg this posting is. Set by the broker converter, which is the only
  // thing that knows whether a row is the user's cash or the income it came from.
  // Unset means USER, so an upload that says nothing about kind reads as an ordinary
  // broker account posting.
  portfoliodb.type.v1.AccountType account_type = 3 [(buf.validate.field).enum.defined_only = true];
  // Broker's instrument description string. Required.
  string instrument_description = 4 [(buf.validate.field).string.min_len = 1];
  // Optional external identifier hints (e.g. ISIN, CUSIP, FIGI, MIC_TICKER). When supplied, resolution uses these and does not store (source, description) on the instrument.
  repeated InstrumentIdentifier identifier_hints = 5;
  // The asset class the source states for the instrument, as a routing hint.
  // Unset means no claim. Not authoritative: the canonical class comes from
  // identifier plugins. See docs/adr/0013-security-type-hint-vs-asset-class.md.
  portfoliodb.type.v1.AssetClass asset_class_hint = 6 [(buf.validate.field).enum.defined_only = true];
  // The candidate event types the source declared, at whatever specificity it
  // manages. Same semantics as the archive Posting's broker_tx_type: an
  // antichain, weight-neutral, AMBIGUOUS (15) excluded.
  repeated portfoliodb.type.v1.TxType broker_tx_type = 7 [
    (buf.validate.field).repeated = {
      min_items: 1
      unique: true
      items: {
        enum: {defined_only: true, not_in: [0, 15]}
      }
    }
  ];
  // Signed quantity as a decimal string: positive for buys/adds, negative for
  // sells/reductions. Exact, because a holding is a sum of these and a group's
  // balance is a sum of their weights.
  string quantity = 8 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  // Unit price as reported by broker. Optional; not used for valuation.
  // Explicitly optional because a declared price of zero is not the same as no
  // price. Balancing converts a purchase or sale to its settlement currency at
  // this price, so an option that expires worthless converts at zero and its
  // group balances, while a row whose converter supplied no price cannot convert
  // and leaves a residual in the security itself. Collapsing the two would let a
  // missing price balance silently. See docs/spec/postings.md.
  // A decimal string, in the trading currency.
  optional string unit_price = 9 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  // Currency in which the instrument is denominated (trading currency, e.g. EUR for SAF). Optional. Passed to plugins as the currency hint. For cash transactions only, set this (same as settlement when user selects one currency).
  string trading_currency = 10;
  // Currency used to pay/settle the transaction (e.g. GBP when buying in a UK account). Optional. Set from user input (e.g. Fidelity converter) for all transactions.
  string settlement_currency = 11;
  // The cash total the source stated for this row, in settlement_currency,
  // unsigned. Same semantics as the archive Posting's settlement_amount:
  // transcribed rather than computed, and present only where the posting's own
  // quantity is not money. Grouping evidence; it has no part in weight or
  // balance.
  optional string settlement_amount = 12 [(buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]+)?$"];
  // Why this posting might belong with another one, as the source stated it:
  // an identifier, what may be compared about it, and over what set of
  // postings. Set by the broker converter, which is the only thing that knows
  // how its broker encodes the evidence, and stored.
  //
  // The archive message rather than one of this package's own, because a
  // correlation is written to an archive file and read back from one, and two
  // declarations would need converting between on every ingest.
  repeated portfoliodb.archive.v1.Correlation correlations = 13;
  // Resolved instrument id (UUID). Set by identification during ingestion.
  string instrument_id = 14;
  // The single value grouping narrowed broker_tx_type to: a leaf where a pass
  // claimed the posting, the common ancestor of the surviving candidates where
  // nothing did, AMBIGUOUS for an unresolved cross-branch set. Server-derived;
  // ignored on upload and always present on the way out.
  portfoliodb.type.v1.TxType resolved_tx_type = 15 [(buf.validate.field).enum.defined_only = true];
  // Split-adjusted quantity (quantity * cumulative split factor). Equal to
  // quantity when no splits exist for the instrument. A decimal string, carrying
  // the column's declared rounding scale; an exact check reads quantity instead.
  //
  // Optional because it is server-computed: an upload leaves it unset and the
  // database derives it from quantity, so requiring it would make every client
  // send a value it has no way to know. It is always present on the way out.
  optional string split_adjusted_quantity = 16 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  // Split-adjusted unit price (unit_price / cumulative split factor). Optional
  // for the same reason as unit_price, and absent exactly when it is.
  optional string split_adjusted_unit_price = 17 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  // The economic event this posting is a leg of. Every posting belongs to exactly
  // one group -- a lone posting is a group of one -- so this is always set on the
  // way out, and it is what a client assembles a listed page back into events by.
  //
  // Server-derived, and rejected on upload for the reason synthetic_purpose is:
  // grouping owns the partition and rederives it whenever a group changes, so a
  // source stating one would be stating an answer rather than supplying data.
  // See docs/adr/0041-server-owns-transaction-grouping.md.
  string group_id = 18;
  // The date of the event, which is the earliest order_date of its legs.
  // Server-derived and output-only like group_id, and the same for every posting of
  // a group.
  //
  // It is what a listing orders its groups by, and so what a client shows on the row
  // standing for the event: a group's legs can be dated apart -- a deposit run
  // settles over several days -- and showing the leg's own date there would order
  // the list by one date and display another.
  google.protobuf.Timestamp group_timestamp = 19;
  // Why the server made this posting, empty on one a source stated. 'RESIDUAL' is
  // what a group's legs did not balance to, routed to an explicit counterparty;
  // 'INITIALIZE' is a synthetic opening balance derived from a holding declaration.
  //
  // Server-derived, and rejected on upload: a posting carrying one is thrown away and
  // derived again whenever its group changes, so a source that could claim it would
  // have its row silently discarded. It is what separates derived from stated, since
  // account_type cannot -- a routed residual and a leg a converter read out of a
  // record land in the same account types.
  string synthetic_purpose = 20;
  // When the transaction took effect: the date a trade executed, or a charge was
  // levied, or money moved. Duplicated from order_date by a source that reports one
  // date and no other. See archive.v1.Posting.trade_date. Required.
  google.protobuf.Timestamp trade_date = 21 [(buf.validate.field).required = true];
}

// ApiService provides gRPC endpoints for the web front end: portfolio CRUD,
// listing transactions and holdings, and ingestion job status.
service ApiService {
  // Portfolios
  rpc ListPortfolios(ListPortfoliosRequest) returns (ListPortfoliosResponse);
  rpc GetPortfolio(GetPortfolioRequest) returns (GetPortfolioResponse);
  rpc CreatePortfolio(CreatePortfolioRequest) returns (CreatePortfolioResponse);
  rpc UpdatePortfolio(UpdatePortfolioRequest) returns (UpdatePortfolioResponse);
  rpc DeletePortfolio(DeletePortfolioRequest) returns (DeletePortfolioResponse);
  rpc GetPortfolioFilters(GetPortfolioFiltersRequest) returns (GetPortfolioFiltersResponse);
  rpc SetPortfolioFilters(SetPortfolioFiltersRequest) returns (SetPortfolioFiltersResponse);
  rpc ListBrokersAndAccounts(ListBrokersAndAccountsRequest) returns (ListBrokersAndAccountsResponse);

  // Transactions and holdings: by portfolio view (portfolio_id set) or all user data (portfolio_id empty). Portfolios are the general filtering mechanism; ListTxs additionally accepts a broker filter and sort direction so a client can fetch the most recent transaction for one broker in a single request (see adr/0015-listtxs-broker-filter.md).
  rpc ListTxs(ListTxsRequest) returns (ListTxsResponse);
  rpc GetHoldings(GetHoldingsRequest) returns (GetHoldingsResponse);

  // Async ingestion job status and validation errors
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // Instruments: browse and search (any authenticated user).
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse);

  // System archive export/import (admin-only). Export streams one whole
  // document; import applies one asynchronously, sequencing its parts
  // server-side. See ExportSystemArchiveRequest and ImportSystemArchiveRequest.
  rpc ExportSystemArchive(ExportSystemArchiveRequest) returns (stream ExportSystemArchiveResponse);
  rpc ImportSystemArchive(ImportSystemArchiveRequest) returns (ImportSystemArchiveResponse);

  // User archive export (any authenticated user). Exports the caller's own data
  // and no system data at all, in the same stream shape as the system export.
  // See docs/adr/0033-system-and-user-archives-are-separate.md.
  rpc ExportUserArchive(ExportUserArchiveRequest) returns (stream ExportUserArchiveResponse);
  rpc ImportUserArchive(ImportUserArchiveRequest) returns (ImportUserArchiveResponse);

  // Identifier plugin config (admin-only). List all plugins; update enabled, precedence, and config JSON (including API keys).
  rpc ListIdentifierPlugins(ListIdentifierPluginsRequest) returns (ListIdentifierPluginsResponse);
  rpc UpdateIdentifierPlugin(UpdateIdentifierPluginRequest) returns (UpdateIdentifierPluginResponse);

  // Candidate plugin config (admin-only). List all plugins; update enabled, precedence, and config JSON.
  rpc ListCandidatePlugins(ListCandidatePluginsRequest) returns (ListCandidatePluginsResponse);
  rpc UpdateCandidatePlugin(UpdateCandidatePluginRequest) returns (UpdateCandidatePluginResponse);

  // Price plugin config (admin-only). List all plugins; update enabled, precedence, and config JSON.
  rpc ListPricePlugins(ListPricePluginsRequest) returns (ListPricePluginsResponse);
  rpc UpdatePricePlugin(UpdatePricePluginRequest) returns (UpdatePricePluginResponse);

  // Reorder plugins within a category (admin-only). Reassigns precedence in a
  // single transaction using deferred constraints. plugin_ids is ordered from
  // highest precedence (index 0) to lowest; all plugins in the category must
  // be present.
  rpc ReorderPlugins(ReorderPluginsRequest) returns (ReorderPluginsResponse);

  // Trigger a price fetch cycle (admin-only). Returns immediately; fetch runs async.
  // For use by external cron jobs or after manual data corrections.
  rpc TriggerPriceFetch(TriggerPriceFetchRequest) returns (TriggerPriceFetchResponse);

  // Price fetch blocks (admin-only). Permanently blocked (instrument, plugin) pairs.
  rpc ListPriceFetchBlocks(ListPriceFetchBlocksRequest) returns (ListPriceFetchBlocksResponse);
  rpc DeletePriceFetchBlock(DeletePriceFetchBlockRequest) returns (DeletePriceFetchBlockResponse);

  // Portfolio valuation: daily portfolio value over a date range.
  rpc GetPortfolioValuation(GetPortfolioValuationRequest) returns (GetPortfolioValuationResponse);

  // EOD prices (admin-only). Browse cached price data.
  rpc ListPrices(ListPricesRequest) returns (ListPricesResponse);

  // Delete telemetry runs past the retention window, cascading to the event rows
  // beneath them (admin-only). Synchronous, and returns what it deleted: unlike
  // the Trigger RPCs there is no worker behind this, and nothing in the service
  // schedules it -- an external scheduler calls it.
  rpc PurgeTelemetry(PurgeTelemetryRequest) returns (PurgeTelemetryResponse);

  // Worker status (admin-only). Returns current state of background workers.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);

  // Holding declarations: declare known holding quantities at a point in time.
  rpc ListHoldingDeclarations(ListHoldingDeclarationsRequest) returns (ListHoldingDeclarationsResponse);
  rpc CreateHoldingDeclaration(CreateHoldingDeclarationRequest) returns (CreateHoldingDeclarationResponse);
  rpc UpdateHoldingDeclaration(UpdateHoldingDeclarationRequest) returns (UpdateHoldingDeclarationResponse);
  rpc DeleteHoldingDeclaration(DeleteHoldingDeclarationRequest) returns (DeleteHoldingDeclarationResponse);

  // Display currency preference.
  rpc GetDisplayCurrency(GetDisplayCurrencyRequest) returns (GetDisplayCurrencyResponse);
  rpc SetDisplayCurrency(SetDisplayCurrencyRequest) returns (SetDisplayCurrencyResponse);
  // Price gaps (admin-only). Returns date ranges where prices are needed but not cached.
  rpc ListPriceGaps(ListPriceGapsRequest) returns (ListPriceGapsResponse);

  // Inflation indices (admin-only). Browse stored monthly inflation data.
  rpc ListInflationIndices(ListInflationIndicesRequest) returns (ListInflationIndicesResponse);

  // Inflation plugin config (admin-only). List all plugins; update enabled, precedence, and config JSON.
  rpc ListInflationPlugins(ListInflationPluginsRequest) returns (ListInflationPluginsResponse);
  rpc UpdateInflationPlugin(UpdateInflationPluginRequest) returns (UpdateInflationPluginResponse);

  // Trigger an inflation fetch cycle (admin-only). Returns immediately; fetch runs async.
  rpc TriggerInflationFetch(TriggerInflationFetchRequest) returns (TriggerInflationFetchResponse);

  // Corporate event plugin admin endpoints. Mirror the price/inflation
  // plugin endpoints. Stock splits and cash dividends are stored as
  // separate entities and refreshed by the corporate event fetcher worker.
  rpc ListCorporateEventPlugins(ListCorporateEventPluginsRequest) returns (ListCorporateEventPluginsResponse);
  rpc UpdateCorporateEventPlugin(UpdateCorporateEventPluginRequest) returns (UpdateCorporateEventPluginResponse);
  rpc TriggerCorporateEventFetch(TriggerCorporateEventFetchRequest) returns (TriggerCorporateEventFetchResponse);

  // Trigger a transfer matching cycle (admin-only). Returns immediately; the pass
  // runs async. For use by an external cron job or CLI, and after a manual
  // correction. A cycle reads every unmatched side rather than a window, so
  // running it more often than needed costs one query and finds nothing new.
  rpc TriggerTransferMatch(TriggerTransferMatchRequest) returns (TriggerTransferMatchResponse);
  // Trigger a transaction grouping cycle (admin-only). Returns immediately; the
  // pass runs async. For use by an external cron job or CLI, and after an import.
  // A cycle derives the partition from stored evidence and reports how it differs
  // from the one stored; it writes nothing until the converters are retired.
  rpc TriggerGrouping(TriggerGroupingRequest) returns (TriggerGroupingResponse);

  // Corporate event import / export. Mirrors the price import/export RPCs:
  // import is async via the job queue, export streams every event with the
  // best identifier per instrument.

  // Unhandled corporate events (reverse splits, non-whole splits, mergers, etc.)
  // that require admin review.
  rpc ListUnhandledCorporateEvents(ListUnhandledCorporateEventsRequest) returns (ListUnhandledCorporateEventsResponse);
  rpc CountUnhandledCorporateEvents(CountUnhandledCorporateEventsRequest) returns (CountUnhandledCorporateEventsResponse);
  rpc ResolveUnhandledCorporateEvent(ResolveUnhandledCorporateEventRequest) returns (ResolveUnhandledCorporateEventResponse);

  // Residual balances (admin-only). The net IMBALANCE, TRANSFER_CLEARING and
  // SOURCE_ROUNDING value left in each broker account: a direct measure of how lossy
  // each broker converter is, of which transfers are missing a side, and of what the
  // source's own rounding costs.
  rpc ListResidualBalances(ListResidualBalancesRequest) returns (ListResidualBalancesResponse);
  rpc CountResidualBalances(CountResidualBalancesRequest) returns (CountResidualBalancesResponse);
}

// Portfolio is a user-owned container for transactions and holdings.
message Portfolio {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}

// ListPortfolios returns portfolios owned by the authenticated user.
message ListPortfoliosRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListPortfoliosResponse {
  repeated Portfolio portfolios = 1;
  string next_page_token = 2;
}

message GetPortfolioRequest {
  string portfolio_id = 1;
}

message GetPortfolioResponse {
  Portfolio portfolio = 1;
}

message CreatePortfolioRequest {
  string name = 1;
}

message CreatePortfolioResponse {
  Portfolio portfolio = 1;
}

message UpdatePortfolioRequest {
  string portfolio_id = 1;
  string name = 2;
}

message UpdatePortfolioResponse {
  Portfolio portfolio = 1;
}

message DeletePortfolioRequest {
  string portfolio_id = 1;
}

message DeletePortfolioResponse {}

// Portfolio filter: one of broker, account, or instrument. filter_value is broker name, account string, or instrument UUID.
message PortfolioFilterProto {
  string filter_type = 1;   // "broker", "account", "instrument"
  string filter_value = 2;
}

message GetPortfolioFiltersRequest {
  string portfolio_id = 1;
}

message GetPortfolioFiltersResponse {
  repeated PortfolioFilterProto filters = 1;
}

message SetPortfolioFiltersRequest {
  string portfolio_id = 1;
  repeated PortfolioFilterProto filters = 2;
}

message SetPortfolioFiltersResponse {}

// ListBrokersAndAccounts returns distinct broker/account pairs for the authenticated user.
message ListBrokersAndAccountsRequest {}

// BrokerAccounts groups accounts under a single broker.
message BrokerAccounts {
  string broker = 1;
  repeated string accounts = 2;
}

message ListBrokersAndAccountsResponse {
  repeated BrokerAccounts brokers = 1;
}

// PortfolioTx pairs a transaction with its broker, account, and optional resolved instrument for list responses.
message PortfolioTx {
  portfoliodb.type.v1.Broker broker = 1;
  Tx tx = 2;
  Instrument instrument = 3;  // optional; set when instrument_id was resolved
  string account = 4;  // from Tx; echoed for convenience when listing
}

message ListTxsRequest {
  string portfolio_id = 1;  // if set, list txs in this portfolio view; otherwise all user transactions
  // Half-open [period_from, period_before); unset bounds are open-ended.
  google.protobuf.Timestamp period_from = 2;   // inclusive
  google.protobuf.Timestamp period_before = 3; // exclusive
  // How many transaction groups a page holds, not how many postings: a page is a
  // whole number of events, so a client can assemble them without a group's legs
  // straddling a page boundary. The row count of a page is however many legs those
  // groups have. Defaults to 50 and is capped at 100.
  int32 page_size = 4;
  string page_token = 5;
  // Restrict to one broker. BROKER_UNSPECIFIED = all brokers. Applies to both
  // the portfolio view and the all-transactions listing.
  portfoliodb.type.v1.Broker broker = 6 [(buf.validate.field).enum = {defined_only: true}];
  // Order by order_date descending (newest first). Default is ascending.
  bool descending = 7;
}

message ListTxsResponse {
  repeated PortfolioTx txs = 1;
  string next_page_token = 2;
}

// Holding is the aggregate quantity of an instrument in a portfolio (or per account for user/portfolio views).
message Holding {
  portfoliodb.type.v1.Broker broker = 1;
  string account = 2;  // account string from txs; holdings are grouped by (broker, account, instrument)
  string instrument_description = 3;
  // Resolved instrument id (UUID). Set when identification ran for the underlying txs.
  string instrument_id = 4;
  Instrument instrument = 5;  // optional; set when instrument_id was resolved
  // The position, in today's share count: a sum of the contributing postings'
  // split_adjusted_quantity, which is the only denomination they share. The raw
  // quantities are each in their own posting's share_count_basis and are not
  // summable at all, so no as-traded figure is reported here; the transaction
  // list carries them per posting. See spec/bitemporality.md.
  //
  // Exact to the columns' declared rounding scale rather than exact outright,
  // with the bound growing in the number of contributing postings; see
  // spec/performance.md.
  string split_adjusted_quantity = 6 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
}

message GetHoldingsRequest {
  string portfolio_id = 1;
  google.protobuf.Timestamp as_of = 2;
}

message GetHoldingsResponse {
  repeated Holding holdings = 1;
  google.protobuf.Timestamp as_of = 2;
}

// Job status for async ingestion.
enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  RUNNING = 2;
  SUCCESS = 3;
  FAILED = 4;
}

message ValidationError {
  int32 row_index = 1;
  string field = 2;
  string message = 3;
}

// IdentificationError is recorded when identification fails (e.g. plugin timeout) or broker description only.
message IdentificationError {
  int32 row_index = 1;
  string instrument_description = 2;
  string message = 3;
}

message GetJobRequest {
  string job_id = 1;
}

// JobPartResult is one part of an archive as applied by one job. A row
// exists for every part the document carried from the moment the job is created,
// so a page rendering a row per part shows the same rows before, during and
// after the run, including after a reload.
//
// status is FAILED only for a hard failure -- an unreadable payload, or a
// database error that ended the part. A row the import could not use is a
// validation error on a part that still succeeded, which is what lets a result
// read "completed, 12 rows rejected".
message JobPartResult {
  portfoliodb.archive.v1.ArchivePart part = 1;
  JobStatus status = 2;
  int32 total_count = 3;
  int32 processed_count = 4;
  // Row-level problems attributed to this part. row_index is the index of the
  // group (prices, corporate events) or of the instrument (instruments) the
  // problem was found in. It is -1 for a part whose unit is a setting rather
  // than a row, where there is nothing to point at.
  repeated ValidationError validation_errors = 5;
  // The hard failure that ended the part. Empty unless status is FAILED.
  string message = 6;
}

message GetJobResponse {
  JobStatus status = 1;
  // Problems with no part of their own: transaction jobs, and an archive that
  // failed before any part was reached. Per-part problems are on the part.
  repeated ValidationError validation_errors = 2;
  repeated IdentificationError identification_errors = 3;
  int32 total_count = 4;
  int32 processed_count = 5;
  // One row per part the archive carried, in restore order. Empty for any job
  // that is not an archive import.
  repeated JobPartResult parts = 6;
}

