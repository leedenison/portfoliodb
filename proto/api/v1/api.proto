// ExportSystemArchiveRequest asks for one system archive document. Admin only.
message ExportSystemArchiveRequest {
  // Which parts to include: the export menu. A part not named here is absent
  // from the document, which says it was not included at all. A part named here
  // is present even when it holds nothing, which says the export included it and
  // there was nothing. The two are different statements and a reader relies on
  // the difference.
  repeated portfoliodb.archive.v1.ArchivePart parts = 1 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // Filters for the instrument part, ignored when INSTRUMENTS is not selected.
  string exchange = 2; // optional; empty = all exchanges
  repeated portfoliodb.type.v1.AssetClass asset_classes = 3; // optional; empty = every instrument
}

// ExportSystemArchiveResponse is one element of the export stream: the envelope
// first and exactly once, then for each selected part a part_begin followed by
// that part's items.
//
// part_begin is what carries a part that is present and empty. Without it a
// selected part holding nothing would be indistinguishable on the wire from one
// that was never selected, and those mean different things.
//
// The stream is a document taken apart, because a part is too large to buffer
// server-side and too large to send as one message. The envelope travels on it
// rather than being built by the caller because exported_at is knowledge time
// and has to be the server's clock, and source_instance is a server property the
// browser does not know.
message ExportSystemArchiveResponse {
  oneof item {
    portfoliodb.archive.v1.Envelope envelope = 1;
    ArchivePartBegin part_begin = 2;
    portfoliodb.archive.v1.Instrument instrument = 3;
    portfoliodb.archive.v1.PriceGroup price_group = 4;
    portfoliodb.archive.v1.CorporateEventGroup corporate_event_group = 5;
    portfoliodb.archive.v1.InflationGroup inflation_group = 6;
    portfoliodb.archive.v1.FetchBlockGroup fetch_block_group = 7;
    portfoliodb.archive.v1.UnhandledEventGroup unhandled_event_group = 8;
    // A flat list, so one row per message rather than one group.
    portfoliodb.archive.v1.PluginConfig plugin_config = 9;
  }
}

// ArchivePartBegin marks the start of one part's items in an export stream.
message ArchivePartBegin {
  portfoliodb.archive.v1.ArchivePart part = 1;
}

// ImportSystemArchiveRequest carries one whole system archive. The parts are
// applied server-side in restore order -- the order ArchivePart numbers them --
// so a client that navigates away mid-import does not stop it, and the caller
// polls one job rather than sequencing the parts itself.
//
// A part absent from the document is not applied. A part present and empty is
// applied and produces a result with a total of zero: "the export included it
// and there was nothing" is a statement the import honours rather than an error.
// To import one kind of data, supply a document carrying only that part.
//
// The archive is the file's own document, forwarded rather than rebuilt, so the
// server sees the format_version and the kind the file declared rather than what
// the uploading client assumed.
message ImportSystemArchiveRequest {
  portfoliodb.archive.v1.SystemArchive archive = 1 [(buf.validate.field).required = true];
  string filename = 2; // optional; shown in the job list
}

// ImportSystemArchiveResponse returns immediately with the job to poll. Per-part
// progress and results are on GetJobResponse.parts.
message ImportSystemArchiveResponse {
  string job_id = 1;
}

// ExportUserArchiveRequest asks for one user archive document: the caller's own
// data. The include-menu works exactly as the system export's does.
message ExportUserArchiveRequest {
  // Naming a part of the system archive here is an error rather than a part
  // quietly missing from the document.
  repeated portfoliodb.archive.v1.ArchivePart parts = 1 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // Half-open [period_from, period_before) over the postings exported; an unset
  // bound is open-ended, which is what an ordinary whole-history export sends.
  // Applies to the transaction part alone -- preferences and declarations are not
  // dated by a period the way a posting is.
  //
  // The export adheres strictly to the period asked for. A group straddling a
  // bound contributes only its in-period legs, so the exported group does not
  // balance -- which the format already accepts, because the importer routes the
  // residual. Without a period every window is derived from the postings it
  // carries and the case cannot arise.
  google.protobuf.Timestamp period_from = 2;   // inclusive
  google.protobuf.Timestamp period_before = 3; // exclusive
}

// ImportUserArchiveRequest carries one whole user archive: the caller's own
// data, applied to the caller's own account. A user archive does not name its
// user, so restoring one into a different account is a feature rather than an
// accident.
//
// The parts are applied server-side in restore order, exactly as the system
// import applies its own, and the caller polls one job rather than sequencing
// the parts itself.
//
// Restoring into an instance whose instruments are not loaded is supported and
// correct: postings resolve through the normal identifier path. It is merely
// slower, which is the cost restoring the system archive first avoids -- a
// recommendation, not a constraint.
message ImportUserArchiveRequest {
  portfoliodb.archive.v1.UserArchive archive = 1 [(buf.validate.field).required = true];
  string filename = 2; // optional; shown in the job list
}

// ImportUserArchiveResponse returns immediately with the job to poll. Per-part
// progress and results are on GetJobResponse.parts.
message ImportUserArchiveResponse {
  string job_id = 1;
}

// ExportUserArchiveResponse is one element of the export stream, with the same
// grammar as ExportSystemArchiveResponse: the envelope first and exactly once,
// then for each selected part a part_begin followed by that part's items.
//
// A part whose unit is a setting rather than a row travels as one whole-part
// message rather than as a series of items. part_begin still precedes it, so the
// grammar does not fork: the marker is what creates the container, and a part
// that was asked for and holds nothing is still present and empty.
message ExportUserArchiveResponse {
  oneof item {
    portfoliodb.archive.v1.Envelope envelope = 1;
    ArchivePartBegin part_begin = 2;
    // The whole part in one message, sent once after its part_begin.
    portfoliodb.archive.v1.PreferencePart preferences = 3;
    // One window per broker, each carrying its own groups.
    portfoliodb.archive.v1.TxWindow tx_window = 4;
    // One statement per account and date, each carrying its declarations.
    portfoliodb.archive.v1.Statement declaration_statement = 5;
  }
}

