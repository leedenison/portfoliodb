syntax = "proto3";

package portfoliodb.archive.v1;

import "archive/v1/common.proto";
import "buf/validate/validate.proto";
import "type/v1/type.proto";

option go_package = "github.com/leedenison/portfoliodb/proto/archive/v1;archivev1";

// DeclarationPart is the holding-declaration section of a user archive.
//
// Absence is not deletion. A declaration missing from an imported file is left
// alone, because a file assembled from one statement covers one account and one
// date, and treating everything outside it as retracted would delete the user's
// other checkpoints. This is the opposite of TxWindow, and the asymmetry is
// deliberate: a transaction window states its own scope, a declaration file does
// not.
message DeclarationPart {
  repeated Statement statements = 1;
}

// Statement is one account read at one date: the aggregate root a set of
// declarations comes from. broker and account are in the file rather than in the
// request, because an archive has to be self-describing.
message Statement {
  portfoliodb.type.v1.Broker broker = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string account = 2;
  // Valid time: the date the declared quantities refer to.
  string as_of_date = 3 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  repeated Declaration declarations = 4 [(buf.validate.field).repeated.min_items = 1];
}

// Declaration is one holding the user states at the statement's as_of_date.
//
// The file carries no pad-or-assert discriminator. Which one a declaration is
// follows from the declaration dates for its holding -- the earliest pads, the
// rest are checked -- so a stored copy could only ever disagree with them.
// See docs/adr/0030-declarations-are-padded-then-asserted.md.
message Declaration {
  InstrumentRef instrument = 1 [(buf.validate.field).required = true];
  string declared_qty = 2 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
}
