syntax = "proto3";

package portfoliodb.archive.v1;

import "archive/v1/common.proto";
import "buf/validate/validate.proto";
import "type/v1/type.proto";

option go_package = "github.com/leedenison/portfoliodb/proto/archive/v1;archivev1";

// InstrumentPart is the security-master section of a system archive.
message InstrumentPart {
  repeated Instrument instruments = 1;
}

// Instrument is security-master data as a file carries it: no server UUIDs, no
// joined exchange reference data, and no nested underlying subtree. A derivative
// names the line of its underlying it delivers, and that underlying must itself
// appear in this part, so a shared underlying appears once and the order
// instruments are written in carries no meaning.
//
// A security nests its listings rather than stating one currency, because
// currency, the tradability window and the listing-grain identifiers are all
// facts about a line and cannot sit above the line they vary by. That is the
// same rule that decides every other level of the format.
// See docs/adr/0035-archive-nests-by-aggregate-root.md and
// docs/adr/0068-a-listing-is-a-currency-of-a-security.md.
message Instrument {
  portfoliodb.type.v1.AssetClass asset_class = 1 [(buf.validate.field).enum.defined_only = true];
  // Display name. The importing instance recomputes it from the identifiers, so
  // this is advisory: it survives only where no ticker-like identifier exists to
  // derive one from, which is the case a plugin-supplied name would otherwise be
  // lost in.
  optional string name = 2;
  // The currency lines this security trades in. Every security has at least one,
  // so a file stating none describes nothing this can store.
  repeated Listing listings = 3 [(buf.validate.field).repeated.min_items = 1];
  // The identifiers that name the security itself, however many currencies it
  // trades in: an ISIN, a CUSIP, an OCC symbol. The ones that name a line live
  // on that line. Which of the two a type is, is declared rather than inferred
  // from whether it carries a domain; see docs/spec/identifiers.md.
  //
  // May be empty for a security identified only through its lines -- an equity
  // known by nothing but its ticker -- which is why the minimum is on listings
  // rather than here.
  repeated Identifier identifiers = 4;
  // Provider-scoped identifiers recorded by the identifier plugins, at security
  // grain. These are the output of the paid, rate-limited lookups the archive
  // exists to avoid repeating, so an instrument restored with them is
  // indistinguishable from a resolved one and no plugin is called for it.
  repeated ProviderIdentifier provider_identifiers = 5;
  // The line of the underlying that an OPTION or FUTURE delivers, which must
  // itself appear in this part. Absent for everything else.
  //
  // A line rather than a security: a contract's strike is a price and a price is
  // in a currency, so what it delivers is one currency line of the underlying.
  // The ref therefore carries a currency, and one that does not names no line.
  // See docs/adr/0074-an-options-underlying-is-the-line-its-strike-is-quoted-in.md.
  optional InstrumentRef underlying = 6;
  optional string cik = 7;      // SEC Central Index Key; an identifier plugin lookup result
  optional string sic_code = 8; // SIC industry classification; likewise
  // Option terms, denormalized from the OCC identifier and absent for anything
  // that is not an option. strike is a component of option identity, decoded
  // from the symbol's eight digits of thousandths, so it is an exact decimal:
  // comparing identity components as floats is a latent bug.
  optional string strike = 9 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string expiry = 10 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  optional string put_call = 11 [(buf.validate.field).string = {in: ["C", "P"]}];
  // Deliverable multiplier; absent means the column default of 1. A non-standard
  // split leaves a fraction here -- 3:2 gives 1.5 -- and it multiplies a
  // posting's weight, so it stays exact.
  optional string contract_multiplier = 12 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
}

// Listing is one currency a security trades in, as a file carries it.
//
// A security holds one listing per currency family -- GBX and GBP are one family
// -- and at most one listing whose currency is absent. That last one is not a
// default: it says how many lines the security has is unknown, which is a
// different claim from "exactly one line, and it is this currency". It is never
// priceable and never event-bearing.
//
// Venues are not carried. They are derived from the line's own MIC_TICKER
// identifiers by trigger, and a file that stated them could disagree with them.
message Listing {
  // ISO 4217, in the units the line is quoted in: GBX for a London line quoted
  // in pence, not the GBP its family collapses to. Absent is the unknown line.
  optional string currency = 1;
  // The half-open [valid_from, valid_before) interval the line was tradeable in;
  // an absent bound is open-ended. A delisting closes one, and the security above
  // has no interval of its own -- its lifetime is the hull of its lines'.
  // Descriptive -- no query filters on it -- and derivable from nothing, so a
  // file that drops it loses it for good.
  optional string valid_from = 2 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  optional string valid_before = 3 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  // The identifiers that name this line rather than the security above it: a
  // ticker under its venue, a SEDOL, a composite FIGI.
  repeated Identifier identifiers = 4;
  // Provider-scoped identifiers at the same grain, which is where every one that
  // exists today belongs: a provider addresses a line.
  repeated ProviderIdentifier provider_identifiers = 5;
}

// ProviderIdentifier is one provider-scoped identifier for an instrument.
// identifier_type is free-form and specific to the provider, so it is not the
// IdentifierType vocabulary.
message ProviderIdentifier {
  string provider = 1 [(buf.validate.field).string.min_len = 1];
  string identifier_type = 2 [(buf.validate.field).string.min_len = 1];
  string value = 3 [(buf.validate.field).string.min_len = 1];
  string domain = 4; // optional; absent and empty mean the same thing
}
