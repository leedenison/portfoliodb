syntax = "proto3";

package portfoliodb.archive.v1;

import "archive/v1/common.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "type/v1/type.proto";

option go_package = "github.com/leedenison/portfoliodb/proto/archive/v1;archivev1";

// TxPart is the transaction section of a user archive.
message TxPart {
  repeated TxWindow windows = 1;
}

// TxWindow is one replacement scope: everything the archive holds for one broker
// over one half-open period.
//
// Import replaces rather than appends, because transactions have no natural key
// -- broker statements often supply a date and nothing else. See
// docs/adr/0002-transaction-ingestion-model.md. The window therefore has to be
// stated rather than inferred from the postings it contains: a window holding no
// postings is a valid instruction to clear that period, and a window inferred
// from its rows could never express that.
//
// A group whose postings do not sum to zero is accepted, not rejected: the
// server routes the residual to an IMBALANCE, TRANSFER_CLEARING or
// SOURCE_ROUNDING posting. A group exported with its routed residual already
// sums to zero, so nothing is routed a second time.
message TxWindow {
  portfoliodb.type.v1.Broker broker = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  google.protobuf.Timestamp period_from = 2 [(buf.validate.field).required = true];   // inclusive
  google.protobuf.Timestamp period_before = 3 [(buf.validate.field).required = true]; // exclusive
  // Opaque source label, "<broker>:<client>:<source>". Used for instrument
  // resolution, and as the domain of the (source, description) identifier a
  // posting with no hints falls back to.
  string source = 4 [(buf.validate.field).string.min_len = 1];
  // 5 was a window-wide share_count_basis. It is on the posting instead: a
  // window-wide value can only say "one date for everything", which cannot
  // express the ordinary case, where every posting is as-traded and so carries a
  // different basis from its neighbours.
  reserved 5;
  // 6 was a repeated TxGroup nesting the postings of one economic event. A tx
  // group has no fields of its own -- tx_groups.id, job_id and created_at are
  // generated by the importing instance, and tx_groups.timestamp is the
  // timestamp of the first posting that names the group -- so once the server
  // derives the partition there is nothing left in the level to state. See
  // docs/adr/0043-grouping-does-not-travel-in-the-archive.md.
  reserved 6;
  repeated Posting postings = 7;
}

// Correlation is a broker-neutral statement of why a posting might belong with
// another one: an identifier the source issued, what may be compared about it,
// and over what set of postings. It is the evidence the server derives the
// transaction partition from, in place of being told the partition outright. See
// docs/adr/0048-correlations-declare-their-own-semantics.md.
//
// A converter may only transcribe, never infer. A token may be synthesised from
// the source's own structure -- nesting, containment, an explicit order column
// -- and never from amounts, dates or proximity. Nothing here distinguishes a
// transcribed token from an inferred one, so this is the discipline that keeps
// the converter rules retirable rather than preserving them under a new name.
message Correlation {
  // MATCH_ORDINAL means "the ordinal field is populated and comparable", so the
  // two travel together or not at all. 2 is MATCH_ORDINAL: CEL sees an enum as
  // its number and has no way to name it.
  option (buf.validate.message).cel = {
    id: "correlation.ordinal_with_match_ordinal"
    message: "ordinal is set exactly when MATCH_ORDINAL is declared"
    expression: "has(this.ordinal) == (2 in this.match)"
  };
  option (buf.validate.message).cel = {
    id: "correlation.ordinal_span_needs_ordinal"
    message: "ordinal_span says how far apart two ordinals may be, so it needs one"
    expression: "!has(this.ordinal_span) || has(this.ordinal)"
  };

  // Which series this identifier belongs to, and so what it is comparable with.
  // An order id is never compared against a settlement reference, and the label
  // is what keeps them apart. Free text agreed between a broker's converters
  // rather than a controlled vocabulary: nothing outside the converter that
  // wrote it and the pass that reads it has to spell it.
  string label = 1;
  // The identifier as the source wrote it, compared by MATCH_EXACT. Opaque: a
  // reference in some shape a converter did not expect survives here rather
  // than being normalised away.
  string token = 2 [(buf.validate.field).string.min_len = 1];
  // The number the token carries, where the converter knows how to take one.
  // Explicitly optional because a source whose identifiers are genuinely opaque
  // has none, and manufacturing an ordering it does not have would group
  // unrelated rows silently.
  optional int64 ordinal = 3;
  // The set of postings this identifier is comparable over. Exactly one.
  portfoliodb.type.v1.Scope scope = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  // What may be done with the identifier. At least one, and a set rather than a
  // choice.
  repeated portfoliodb.type.v1.Match match = 5 [
    (buf.validate.field).repeated = {
      min_items: 1
      unique: true
      items: {
        enum: {defined_only: true, not_in: [0]}
      }
    }
  ];
  // How far apart two ordinals can be and still be about one event. Carried by
  // the source because how densely a broker issues references is a fact about
  // its numbering rather than a grouping policy, and a server-side constant
  // would be wrong for every broker but one.
  optional int64 ordinal_span = 6 [(buf.validate.field).int64.gt = 0];
}

// Posting is a signed amount of one commodity in one account at one point in
// time. See docs/spec/postings.md.
message Posting {
  google.protobuf.Timestamp timestamp = 1 [(buf.validate.field).required = true];
  string account = 2; // opaque; the broker's own account label
  // What kind of leg this is. ACCOUNT_TYPE_UNSPECIFIED reads as
  // ACCOUNT_TYPE_USER, so a converter that says nothing produces ordinary broker
  // account postings.
  portfoliodb.type.v1.AccountType account_type = 3 [(buf.validate.field).enum.defined_only = true];
  // What the broker called the event, in OFX vocabulary. Distinct from
  // account_type: a dividend's cash leg and its income leg are both INCOME and
  // differ only by account type.
  portfoliodb.type.v1.TxType type = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string instrument_description = 5 [(buf.validate.field).string.min_len = 1];
  // Identifier hints for resolution. An export writes the one identifier chosen
  // by bestIdentifierJoin; a converter may write several, which the flat CSV
  // could not express. Empty means resolution falls back to the window's source
  // plus this description.
  repeated InstrumentRef identifier_hints = 6;
  // Signed decimal: positive for buys and adds, negative for sells and
  // reductions. Exact, because a holding is a sum of these and a group's balance
  // is a sum of their weights.
  string quantity = 7 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  // Unit price as the source reported it, in trading_currency. Explicitly
  // optional because a declared price of zero is not the same as no price: an
  // option expiring worthless converts at zero and its group balances, while a
  // posting with no price cannot be converted at all and leaves a residual in
  // the security itself.
  optional string unit_price = 8 [(buf.validate.field).string.pattern = "^-?[0-9]+(\\.[0-9]+)?$"];
  optional string trading_currency = 9;     // ISO 4217; the instrument's own currency
  optional string settlement_currency = 10; // ISO 4217; what actually paid
  // The source's own reference for the row this was transcribed from: a Fidelity
  // reference number, an OFX FITID. Durable, unlike grouping, but not a natural
  // key -- one source transaction can produce several postings that share one.
  // Present only on transcribed postings.
  optional string broker_ref = 11;
  // The account the source names as the other side of this row, within the same
  // broker. Advisory: a source can use the same field for attribution instead,
  // so it is read as a transfer pointer only where the group turns out to be
  // one.
  optional string counterparty_account = 12;
  // The share count this posting's quantity and unit price are denominated in,
  // as "YYYY-MM-DD". Absent means this posting's own timestamp date -- the
  // as-traded convention a broker log follows, since a log line accounts only
  // for events prior to the trade, and what an ordinary export writes. Set it
  // only for a source that restates a historical row in current share terms,
  // such as a broker web view showing post-split quantities against pre-split
  // trades. See docs/spec/bitemporality.md.
  optional string share_count_basis = 13 [(buf.validate.field).string.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"];
  // Opaque grouping key, scoped to this file. Postings sharing a non-empty
  // group_ref are legs of one economic event and are stored in one tx group;
  // absent means the posting is its own single-posting group. Not a durable
  // identifier: it is not stored and carries no meaning across files.
  //
  // Transitional. The server is becoming the thing that decides which postings
  // are legs of one event, from the evidence a posting carries
  // (docs/adr/0041-server-owns-transaction-grouping.md), and this field goes when
  // it does. It is here in the meantime because nothing else in the file says
  // what a converter decided, and because the engine is validated by being
  // required to reproduce it exactly.
  optional string group_ref = 14;
  // Why this posting might belong with another one, as the source stated it.
  // Present only on transcribed postings: a converter's derived counter-leg and
  // a server-routed residual transcribe nothing and so correlate with nothing.
  //
  // Durable, unlike group_ref, and stored. Nothing reads it to decide the
  // partition yet -- that is
  // docs/adr/0041-server-owns-transaction-grouping.md's arrival, not this
  // field's -- but it has to be carried and stored from here on, or a rebuild
  // from an archive would have nothing left to group on.
  repeated Correlation correlations = 15;
}
