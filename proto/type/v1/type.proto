syntax = "proto3";

// The controlled vocabularies PortfolioDB stores and transmits: asset classes,
// identifier types, transaction types, account types and brokers. They live in
// their own package because both the API and the archive format need them, and
// the archive cannot import portfoliodb.api.v1 -- an archive is written today
// and read by a server that does not exist yet, so it cannot be bound to a
// schema that is deliberately free to break while the project is pre-release.
// See docs/adr/0034-archive-format-is-its-own-proto-package.md and
// docs/adr/0038-controlled-vocabularies-are-shared.md.
//
// This package is the one part of proto/ that is not free to break. A value is
// never renumbered and never removed, and a value name never changes, because
// these names are the stored vocabulary -- txs.resolved_tx_type holds "TRADE_ASSET",
// instrument_identifiers.identifier_type holds "ISIN" -- and they are what an
// archive written years ago spells on disk. Adding a value is the only
// backwards-compatible change, and even that makes a file naming it unreadable
// to an older server, which is what the archive's format_version is for.
//
// Value names are unprefixed wherever the enum name is not needed to
// disambiguate, so that a name is the same in the proto, in the database and in
// an archive file, with no prefix stripping in between. AccountType, Scope and
// Match are the exceptions and are documented at their declarations.
package portfoliodb.type.v1;

option go_package = "github.com/leedenison/portfoliodb/proto/type/v1;typev1";

// Broker identifies the data source so that the same canonical value is used
// across users uploading data from the same broker.
enum Broker {
  BROKER_UNSPECIFIED = 0;
  IBKR = 1;  // Interactive Brokers
  SCHB = 2;  // Charles Schwab
  FIDELITY = 3;
}

// TxType classifies what kind of economic event a posting is a leg of. The
// values form a tree: a leaf is the specificity the system acts on, an internal
// node is what a less specific source says, and both are legal values. A source
// declares a set of candidates (broker_tx_type) at whatever specificity it can
// defend, and grouping resolves the set to the single value everything
// downstream reads (resolved_tx_type). The type carries the event only:
// direction is the sign of quantity, and asset class is a stated hint. The
// parent map is written in server/txtype (Go) and client/lib/tx-type.ts (TS),
// both checked against the same golden fixture.
// See docs/adr/0044-tx-type-is-declared-and-resolved.md and
// docs/adr/0045-tx-type-does-not-encode-asset-class.md.
enum TxType {
  TX_TYPE_UNSPECIFIED = 0;
  // A commodity exchanged for consideration at a price.
  TRADE       = 1;
  TRADE_ASSET = 2;  // The acquired or disposed leg; weight converts at unit_price.
  TRADE_CASH  = 3;  // The consideration leg; weight is its own amount.
  // Value accruing without a disposal.
  INCOME            = 4;
  DIVIDEND          = 5;  // Distribution from an equity holding.
  INTEREST          = 6;  // Interest received.
  RETURN_OF_CAPITAL = 7;  // Return of principal, not earnings.
  // A cost borne by the holder. The leaves are cut by how the cost is treated,
  // not by what the broker calls the fee.
  EXPENSE          = 8;
  TRANSACTION_COST = 9;   // Commission, levy, stamp duty, FX charge; belongs in cost basis.
  HOLDING_COST     = 10;  // Custody, platform and account fees; not basis.
  FINANCING_COST   = 11;  // Margin interest; not basis.
  // A commodity moving without a change in what is held.
  TRANSFER          = 12;
  TRANSFER_INTERNAL = 13;  // The other side is another account of this user.
  TRANSFER_EXTERNAL = 14;  // The other side is outside the user's holdings.
  // The root of the tree, and the value resolved_tx_type takes when nothing
  // narrows a cross-branch set. Distinct from TX_TYPE_UNSPECIFIED ("the field
  // was not set") and never legal in broker_tx_type, where a cross-branch set
  // is the honest way to say "one of these". Named AMBIGUOUS rather than
  // UNKNOWN because AssetClass already claims UNKNOWN in package scope.
  AMBIGUOUS = 15;
}

// AccountType classifies the account a posting lands in, so that the non-asset side
// of an event that is one-sided in the source data has somewhere to go. A posting
// keeps the broker and account of the event it belongs to; the type says what kind
// of leg it is. Values are prefixed because proto enum values share package scope
// and TxType already defines INCOME and TRANSFER.
// See docs/adr/0022-typed-per-account-cash-flow-boundary.md.
enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;       // Unset on upload; stored as USER.
  ACCOUNT_TYPE_USER = 1;              // An ordinary broker account posting.
  ACCOUNT_TYPE_EQUITY = 2;            // Value entering or leaving the user's holdings entirely.
  ACCOUNT_TYPE_INCOME = 3;            // Dividends, interest and other income.
  ACCOUNT_TYPE_EXPENSE = 4;           // Commissions, levies, custody and service charges, taxes.
  ACCOUNT_TYPE_IMBALANCE = 5;         // The residual of a group that does not sum to zero.
  ACCOUNT_TYPE_TRANSFER_CLEARING = 6; // One side of a transfer whose other side is not yet known.
  ACCOUNT_TYPE_SOURCE_ROUNDING = 7;   // A residual small enough to be the source rounding, not missing data.
}

// Scope is the set of postings a correlation's identifier is comparable over.
// Exactly one is stated. See
// docs/adr/0048-correlations-declare-their-own-semantics.md.
//
// SCOPE_ACCOUNT is not redundant with SCOPE_FILE: an OFX FITID is unique within
// the account rather than within the institution, and a Fidelity export spans
// accounts, so reading an account-scoped token file-wide would produce false
// positives silently.
//
// Values are prefixed because Scope and Match both need an ACCOUNT and proto
// enum values share package scope. The column stores the bare name, as it does
// for AccountType.
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  // The one upload the correlation arrived in, stored as the ingestion job that
  // supplied it: a file has no identity of its own once its postings are rows.
  // An archive import is one job, so file-scoped evidence re-imported from an
  // archive is comparable across everything that archive carried.
  SCOPE_FILE = 1;
  // The broker account the posting names.
  SCOPE_ACCOUNT = 2;
  // This user's data for this broker. A Fidelity reference means nothing across
  // users, and an account label means nothing outside the broker that issued it.
  SCOPE_BROKER = 3;
}

// Match is what may be done with a correlation's identifier once two postings
// hold one. A correlation states at least one, because an identifier can be
// honestly comparable more than one way: a Fidelity reference number is both
// equality-comparable and ordinally comparable, and declaring only one of those
// would understate what the source supplies.
enum Match {
  MATCH_UNSPECIFIED = 0;
  // The tokens are equal. Two postings sharing a token under one label are
  // saying the same thing about themselves.
  MATCH_EXACT = 1;
  // The ordinals are near. This means "the ordinal field is populated and
  // comparable", never "parse the token as a number": an IBKR FITID reads
  // 20251015U10000018371888432, which is not an integer but plainly carries
  // one, and only the converter knows how to take it.
  MATCH_ORDINAL = 2;
  // The token names another posting's account rather than a token that posting
  // carries, so it is compared against the account and never against another
  // token. This is what a source-supplied counterparty pointer says, and it is
  // asymmetric: only one side of a transfer usually names the other.
  MATCH_ACCOUNT = 3;
}

// IdentifierType is the controlled vocabulary for instrument identifier types.
// Stored in instrument_identifiers.identifier_type. Broker description identifiers use BROKER_DESCRIPTION with domain = source (e.g. "Fidelity:web:fidelity-csv").
enum IdentifierType {
  IDENTIFIER_TYPE_UNSPECIFIED = 0;
  ISIN = 1;
  CUSIP = 2;
  SEDOL = 3;
  CINS = 4;
  WERTPAPIER = 5;
  OCC = 6;
  OPRA = 7;
  FUT_OPT = 8;
  OPENFIGI_GLOBAL = 9;
  OPENFIGI_SHARE_CLASS = 10;
  OPENFIGI_COMPOSITE = 11;
  BROKER_DESCRIPTION = 12;
  CURRENCY = 13;
  FX_PAIR = 14;
  MIC_TICKER = 15;
  OPENFIGI_TICKER = 16;
}

// AssetClass is the controlled vocabulary for instrument asset classes.
// Stored in instruments.asset_class. Values are unprefixed so that the name
// in the proto, the name in the column and the name in an archive file are
// the same string, with no prefix stripping between them.
enum AssetClass {
  ASSET_CLASS_UNSPECIFIED = 0;
  STOCK = 1;
  ETF = 2;
  FIXED_INCOME = 3;
  MUTUAL_FUND = 4;
  OPTION = 5;
  FUTURE = 6;
  CASH = 7;
  FX = 8;
  UNKNOWN = 9;
}

// PluginCategory is the controlled vocabulary for the kind of work a plugin
// does. Stored in plugin_config.category, and named on an archive fetch block to
// say which fetcher was stopped.
//
// This is the one vocabulary here whose value names are not the strings the
// column holds: plugin_config.category is lowercase ("corporate_event"), so
// db.PluginCategoryToStr maps between the two. The names are what an archive
// file spells, and those do not change.
enum PluginCategory {
  PLUGIN_CATEGORY_UNSPECIFIED = 0;
  IDENTIFIER = 1;
  DESCRIPTION = 2;
  PRICE = 3;
  INFLATION = 4;
  CORPORATE_EVENT = 5;
}
